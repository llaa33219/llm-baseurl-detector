name: Publish to npm
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v0.1.0, v1.2.3-beta.1, ...
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      # NOTE: no `registry-url` here — setup-node writes a NODE_AUTH_TOKEN-based
      # .npmrc when registry-url is set, which makes npm prefer token auth and
      # bypasses Trusted Publishing OIDC entirely (resulting in E404).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Keep package.json version in sync with the git tag (v1.2.3 -> 1.2.3).
      # No-op when they already match (npm version fails on an unchanged version).
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            npm version --no-git-tag-version "$TAG_VER"
          else
            echo "package.json already at $PKG_VER"
          fi
      # No NODE_AUTH_TOKEN: Trusted Publishing uses the OIDC id-token above.
      - run: npm publish --provenance --access public
