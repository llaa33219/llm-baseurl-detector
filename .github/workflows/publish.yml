name: Publish to npm
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v0.1.0, v1.2.3-beta.1, ...
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'   # npm >= 11.5.1 for trusted publishing
          cache: npm
      - run: npm ci
      - run: npm test
      # Keep package.json version in sync with the git tag (v1.2.3 -> 1.2.3).
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            npm version --no-git-tag-version "$TAG_VER"
          else
            echo "package.json already at $PKG_VER"
          fi
      # Trusted Publishing: npm uses the OIDC id-token (id-token: write above).
      # No NODE_AUTH_TOKEN, no registry-url — npm detects the Actions OIDC env itself.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
